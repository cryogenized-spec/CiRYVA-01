name: CiRYVA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciryva-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout (pinned, read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify specifications, links, and agent skills
        run: python3 scripts/ci_gate.py docs

      - name: Scan tracked text for likely secrets
        run: python3 scripts/ci_gate.py secrets

      - name: Require real Android CI when Android sources appear
        run: python3 scripts/ci_gate.py android

      - name: Self-test CI gate behaviour
        run: python3 -m unittest discover -s tests -p 'test_ci_gate.py' -v
