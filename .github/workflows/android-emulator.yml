name: Android emulator validation (on demand)

# Emulator and system-image downloads are heavy. Run explicitly from
# Actions > Android emulator validation (on demand) > Run workflow.
# Last 3-test API 35/320dp/1.5x run passed on 2026-11-02:
# https://github.com/cryogenized-spec/CiRYVA-01/actions/runs/41451304469
# Keep this heavyweight workflow MANUAL ONLY to protect CI download budget.
# Verified P04 source on 2026-11-02:
# https://github.com/cryogenized-spec/CiRYVA-01/actions/runs/41494773866
# The emulator workflow is MANUAL ONLY to conserve SDK/system-image downloads.
on:
  workflow_dispatch:
  # Temporary one-off P06 device-backed acceptance; restore manual-only afterward.
  push:
    branches: ['feat/p06-local-multimodal-attachments']

permissions:
  contents: read

concurrency:
  group: ciryva-android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-tests:
    name: Emulator UI tests (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper and setup cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify upstream wrapper JAR
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check

      - name: Enable KVM on GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 15 emulator and run actual Compose UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          # The prior 2 GB runner lost adb midway through the 15-test suite.
          # Allow breathing room for 1.5x Compose text and system IME.
          ram-size: 3072M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb shell wm size 960x1920
            adb shell wm density 480
            adb shell settings put system font_scale 1.5
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            # Android instrumentation may remove the target app at teardown.
            # Reinstall the exact debug APK that Gradle just compiled before
            # attempting the optional screenshot; otherwise am start fails.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.ciryva.app/.LiveChatActivity
            sleep 3
            adb exec-out screencap -p > p04-android15-chat.png
            test -s p04-android15-chat.png

      - name: Capture actual launched CiRYVA native chat
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ciryva-premium-chat-android15
          path: p04-android15-chat.png
          retention-days: 14
          if-no-files-found: error
