name: Kotlin foundation

on:
  push:
    branches:
      - main
      - 'foundation/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-core:
    name: Foundation JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only, pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: JDK 17 (pinned)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (pinned Action; version 8.13)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.13'

      - name: Compile and run genuine Kotlin unit tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Assemble Kotlin core JAR
        run: gradle :core:jar --no-daemon
