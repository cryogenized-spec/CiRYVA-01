name: Kotlin foundation

on:
  push:
    branches:
      - main
      - 'foundation/**'
      - 'feat/p05-local-conversation-archive'
      - 'feat/p06-persistent-persona-controls'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-core:
    name: Foundation JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only, pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 17 (pinned)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (pinned Action; version 8.13)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          gradle-version: '8.13'

      - name: Compile and run genuine Kotlin unit tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Assemble Kotlin core JAR
        run: gradle :core:jar --no-daemon
