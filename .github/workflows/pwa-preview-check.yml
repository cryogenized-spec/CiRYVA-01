name: CiRYVA PWA preview checks
on:
  pull_request:
    paths:
      - "web-preview/**"
      - ".github/workflows/pwa-preview-check.yml"
  push:
    branches: [main]
    paths:
      - "web-preview/**"
      - ".github/workflows/pwa-preview-check.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript source syntax
        run: |
          node --check web-preview/app.js
          node --check web-preview/sw.js
      - name: Static page references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('web-preview')
          html = (root/'index.html').read_text()
          for name in ('styles.css','app.js','manifest.webmanifest','icon.svg','sw.js'):
              assert (root/name).is_file(), name
          for name in ('styles.css','app.js','manifest.webmanifest','icon.svg'):
              assert './'+name in html, name
          assert 'modelButton' in html and 'settingsOpen' in html
          assert 'renderChat' in (root/'app.js').read_text()
          PY
